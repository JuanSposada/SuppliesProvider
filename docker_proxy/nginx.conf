upstream backend_service_http {
    # Servidor Principal
    server 192.168.0.242:2025;
}

upstream backend_service_https {
    # Servidor de backup en pythonanywhere (HTTPS)
    server juansposada.pythonanywhere.com:443;
}


server {
    listen 80;
    server_name localhost;

    # 1. Si el servidor principal falla con un 502,
    #    re-dirige internamente a la ubicación @backup
    error_page 504 = @backup; 

    location / {
        # Paso 1: Intenta la conexión HTTP al servidor principal
        proxy_pass http://backend_service_http;
        proxy_connect_timeout 5s;
        
        # Estas directivas son útiles para el failover a otros servers HTTP,
        # pero para el HTTPS las manejaremos en @backup
        proxy_next_upstream error timeout http_502;
    }

    location @backup {
        # Paso 2: Si el principal falló, usamos el protocolo HTTPS
        proxy_pass https://juansposada.pythonanywhere.com;
        
        # Directivas específicas para la conexión SSL/TLS al backend:
        proxy_ssl_server_name on;
        proxy_ssl_verify off; 
        
        # Opcional: Reajusta el timeout para el backup
        proxy_connect_timeout 10s;
    }
}
